<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Dashboard | Ricin Xpress Admin</title>
  <meta name="description" content="Live Ricin Xpress order management dashboard with real-time status updates, search and PDF receipts.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Order Dashboard | Ricin Xpress Admin">
  <meta property="og:description" content="Manage Ricin Xpress deliveries in real time.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>document.documentElement.className+=" js";window.addEventListener("error",function(){document.documentElement.className=document.documentElement.className.replace(" js","");});</script>
</head>
<body>
  <div class="admin-bar">
    <div class="container header-inner">
      <a href="index.html" class="brand"><img src="ricin-wordmark.png" alt="RICIN." class="brand-mark"></a>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button" title="Refresh orders"><i class="fas fa-rotate"></i> <span>Refresh</span></button>
        <button class="btn btn-primary btn-sm" id="logoutBtn" type="button"><i class="fas fa-right-from-bracket"></i> <span>Log Out</span></button>
      </div>
    </div>
  </div>

  <main class="admin-shell">
    <div class="container">
      <header style="margin-bottom:26px">
        <span class="eyebrow">Admin</span>
        <h1 class="page-title" style="font-size:clamp(2rem,4vw,3rem)">Order Dashboard</h1>
        <p class="muted">Live view of every booking — updates arrive automatically.</p>
      </header>

      <div class="grid grid-4">
        <div class="stat-card"><span class="k">Total Orders</span><span class="v" id="statTotal">0</span></div>
        <div class="stat-card accent"><span class="k">Pending</span><span class="v" id="statPending">0</span></div>
        <div class="stat-card"><span class="k">In Progress</span><span class="v" id="statInProgress">0</span></div>
        <div class="stat-card"><span class="k">Completed</span><span class="v" id="statCompleted">0</span></div>
      </div>

      <div class="toolbar">
        <div class="form-group" style="margin:0;flex:1;min-width:220px">
          <label for="searchInput">Search</label>
          <input type="search" id="searchInput" placeholder="Reference, name, phone or address">
        </div>
        <div class="form-group" style="margin:0;min-width:180px">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Order Confirmed</option>
            <option value="onway">On My Way</option>
            <option value="pickedup">Picked Up</option>
            <option value="completed">Delivered</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;min-width:180px">
          <label for="sortFilter">Sort</label>
          <select id="sortFilter">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="collection">Collection date</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Reference</th>
              <th scope="col">Customer</th>
              <th scope="col">Route</th>
              <th scope="col">Collection</th>
              <th scope="col">Status</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>

      <div class="order-cards" id="orderCards"></div>

      <div class="empty-state" id="noOrders" hidden>
        <i class="fas fa-inbox"></i>
        <h3>No orders match your filters</h3>
        <p class="muted">Try clearing the search or choosing a different status.</p>
      </div>
    </div>
  </main>

  <div class="modal" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="result-head">
        <h2 id="modalTitle" style="margin:0">Order Details</h2>
        <button class="btn btn-ghost btn-icon" id="modalClose" type="button" aria-label="Close details"><i class="fas fa-xmark"></i></button>
      </div>
      <div id="modalContent"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modalPdf" type="button"><i class="fas fa-file-pdf"></i> Download PDF</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
