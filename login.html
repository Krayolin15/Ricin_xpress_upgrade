<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Ricin Xpress</title>
  <meta name="description" content="Secure staff access to the Ricin Xpress order management dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Admin Login | Ricin Xpress">
  <meta property="og:description" content="Staff access to the Ricin Xpress delivery dashboard.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>document.documentElement.className+=" js";window.addEventListener("error",function(){document.documentElement.className=document.documentElement.className.replace(" js","");});</script>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="brand" style="justify-content:center;display:inline-flex"><img src="ricin-wordmark.png" alt="RICIN." class="brand-mark"></a>
      <h1>Admin Access</h1>
      <p class="muted">Enter your password to manage orders.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
          <span class="field-error" id="err-password"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In <i class="fas fa-arrow-right"></i></button>
      </form>
      <p class="track-note" style="justify-content:center;margin-top:18px"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to website</a></p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
